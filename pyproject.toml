[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-lambda-kit"
version = "0.1.0"
description = "Small, dependency-free building blocks for secure AWS Lambda APIs: input validation, safe error responses, and least-privilege IAM helpers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Leonardo Flores" }]
keywords = ["aws", "lambda", "api-gateway", "security", "iam", "validation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/lhflores12/secure-lambda-kit"

[tool.setuptools.packages.find]
where = ["src"]
